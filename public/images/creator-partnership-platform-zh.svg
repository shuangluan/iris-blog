<text x="1310" y="762" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">11 家机构（用户调研）</text>
<text x="1310" y="786" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">各地区运营团队</text>
<text x="1310" y="810" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">法务合规</text>

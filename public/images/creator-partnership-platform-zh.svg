<text x="60" y="72" font-size="22" font-weight="700" fill="#f08a4b" text-anchor="start">1 · 背景：为什么必须快</text>
<rect x="60" y="95" width="330" height="145" rx="16" fill="#fff" stroke="#f6c9a8" stroke-width="1.5"/>
<text x="85" y="140" font-size="22" font-weight="700" fill="#1f1b2e" text-anchor="start">11 家合作机构</text>
<text x="85" y="172" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">为内容社区 App</text>
<text x="85" y="194" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">供给优质内容</text>
<line x1="400" y1="167" x2="450" y2="167" stroke="#f08a4b" stroke-width="2.5" marker-end="url(#af08a4b)"/>

<text x="90" y="1058" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">独立撰写</text>
<text x="90" y="1088" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">故意写多</text>
<text x="90" y="1118" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">让取舍可见</text>

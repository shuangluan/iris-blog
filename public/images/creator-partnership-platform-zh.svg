<circle cx="522" cy="381" r="16" fill="#5b6cf0"/>
<text x="522" y="387" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="550" y="388" font-size="19" font-weight="700" fill="#1f1b2e" text-anchor="start">绑定与权限层</text>
<text x="520" y="420" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">机构负责人 → 成员 → 创作者 → 运营</text>

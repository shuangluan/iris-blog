<rect x="820" y="965" width="340" height="210" rx="16" fill="#fff" stroke="#d8c8fb" stroke-width="1.5"/>
<circle cx="856" cy="1003" r="18" fill="#8b5cf6"/>
<text x="856" y="1009" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="886" y="1010" font-size="19" font-weight="700" fill="#1f1b2e" text-anchor="start">按业务风险定 MVP</text>
<text x="850" y="1058" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">工程量 × 不做的业务风险</text>
<text x="850" y="1088" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">工作量小、风险高：保留</text>
<text x="850" y="1118" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">工作量大、风险低：砍掉</text>
<line x1="1163" y1="1070" x2="1196" y2="1070" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a8b5cf6)"/>

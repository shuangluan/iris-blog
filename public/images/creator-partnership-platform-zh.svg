<text x="1095" y="1459" font-size="26" font-weight="700" fill="#ffd1b3" text-anchor="start">商业化基础</text>
<text x="1095" y="1489" font-size="14" font-weight="400" fill="#c9c4dd" text-anchor="start">成为后续商业化</text>

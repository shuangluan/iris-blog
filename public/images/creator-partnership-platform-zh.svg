<text x="80" y="764" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">审核、管理、</text>
<text x="80" y="786" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">监控内容供给</text>

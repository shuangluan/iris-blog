<text x="506" y="1010" font-size="19" font-weight="700" fill="#1f1b2e" text-anchor="start">3 天技术评估</text>
<text x="470" y="1058" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">服务端 + 前端负责人</text>
<text x="470" y="1088" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">每条需求：工作量 + 风险</text>
<text x="470" y="1118" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">不开会</text>

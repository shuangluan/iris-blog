<text x="590" y="1381" font-size="14" font-weight="400" fill="#c9c4dd" text-anchor="start">没有一家转向第三方</text>
<rect x="1070" y="1285" width="475" height="115" rx="16" fill="#2b2640" stroke="#3a3456" stroke-width="1.5"/>

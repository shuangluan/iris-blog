<text x="985" y="132" font-size="15" font-weight="700" fill="#2f9e6e" text-anchor="start">决策 · 与运营负责人和管理层</text>
<text x="985" y="170" font-size="24" font-weight="700" fill="#1f1b2e" text-anchor="start">自建协作平台</text>
<text x="985" y="202" font-size="18" font-weight="600" fill="#1f1b2e" text-anchor="start">2 个月从 0 到 1</text>
<text x="985" y="228" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">掌控供给链 · 保住机构信任 · 守住内容质量</text>

<text x="60" y="942" font-size="22" font-weight="700" fill="#8b5cf6" text-anchor="start">4 · MVP 范围方法：让 8 周成为可能的四步</text>
<rect x="60" y="965" width="340" height="210" rx="16" fill="#fff" stroke="#d8c8fb" stroke-width="1.5"/>

<text x="520" y="550" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">任务下发 → 提交 → 审核 → 可发布</text>
<text x="520" y="572" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">先做图文，视频放 V2</text>
<rect x="490" y="605" width="470" height="115" rx="16" fill="#fff" stroke="#c9cff8" stroke-width="1.5"/>

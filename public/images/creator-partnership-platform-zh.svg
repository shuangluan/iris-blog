<text x="520" y="680" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">合作周期跟踪、创作者分配</text>
<text x="520" y="702" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">交付管理</text>
<rect x="490" y="735" width="470" height="115" rx="16" fill="#fff" stroke="#c9cff8" stroke-width="1.5"/>
<circle cx="522" cy="771" r="16" fill="#5b6cf0"/>
<text x="522" y="777" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="550" y="778" font-size="19" font-weight="700" fill="#1f1b2e" text-anchor="start">数据看板</text>
<text x="520" y="810" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">机构视图 + 运营视图</text>
<text x="520" y="832" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">双方看同一份数据，建立信任</text>

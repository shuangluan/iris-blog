<text x="1095" y="1361" font-size="14" font-weight="400" fill="#c9c4dd" text-anchor="start">机构签约创作者</text>
<rect x="60" y="1413" width="475" height="115" rx="16" fill="#2b2640" stroke="#3a3456" stroke-width="1.5"/>
<text x="85" y="1459" font-size="26" font-weight="700" fill="#ffd1b3" text-anchor="start">邮件 → 数小时</text>
<text x="85" y="1489" font-size="14" font-weight="400" fill="#c9c4dd" text-anchor="start">平台内完成稿件审核</text>

<text x="80" y="594" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">接任务、交稿、</text>
<text x="80" y="616" font-size="14" font-weight="400" fill="#5b5670" text-anchor="start">看审核进度</text>
<line x1="282" y1="590" x2="330" y2="575" stroke="#5b6cf0" stroke-width="2.5" marker-end="url(#a5b6cf0)"/>

<text x="485" y="135" font-size="20" font-weight="700" fill="#d9452b" text-anchor="start">竞争威胁</text>
<text x="485" y="166" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">机构收到第三方工具报价</text>
<text x="485" y="188" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">可能失去对内容供给链</text>
<text x="485" y="210" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">和内容质量的掌控</text>

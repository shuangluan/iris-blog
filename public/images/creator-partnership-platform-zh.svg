<text x="1236" y="1009" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="1266" y="1010" font-size="19" font-weight="700" fill="#1f1b2e" text-anchor="start">每周砍范围</text>
<text x="1230" y="1058" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">每周 30 分钟</text>
<text x="1230" y="1088" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">还能按时上线吗？</text>
<text x="1230" y="1118" font-size="15" font-weight="400" fill="#5b5670" text-anchor="start">加一个，就拿掉一个</text>
